apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema-init
  namespace: flag-service
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-schema-init
    spec:
      restartPolicy: Never
      containers:
        - name: db-schema-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: FLAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-secrets
                  key: DATABASE_URL
          command:
            - sh
            - -ec
            - |
              psql "$FLAG_DATABASE_URL" -v ON_ERROR_STOP=1 -f /schemas/flag-init.sql
          volumeMounts:
            - name: db-init-sql
              mountPath: /schemas
              readOnly: true
      volumes:
        - name: db-init-sql
          configMap:
            name: configmap
